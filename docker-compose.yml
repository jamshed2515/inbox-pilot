services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: email_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-email_scheduler}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-email_scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler_network

  # Redis for BullMQ Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: email_scheduler_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduler_network

  # Elasticsearch for Email Logs & Analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: email_scheduler_elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es-scheduler
      - cluster.name=scheduler-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - scheduler_network

volumes:
  postgres_data:
    name: email_scheduler_postgres_data
  redis_data:
    name: email_scheduler_redis_data
  es_data:
    name: email_scheduler_es_data

networks:
  scheduler_network:
    name: email_scheduler_network
    driver: bridge
